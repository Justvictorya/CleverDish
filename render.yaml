# Render.com deployment
# Creates a Web Service with a persistent disk mounted at /data so price
# samples, overrides, auth tokens and uploaded plate photos survive restarts.
services:
  - type: web
    name: cleverdish
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: cleverdish-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        sync: false